<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mahmuda Rewards</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ff;
      text-align: center;
      color: #333;
    }

    .container {
      max-width: 420px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      margin-top: 40px;
      color: #6c5ce7;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-top: 25px;
    }

    .balance {
      font-size: 28px;
      font-weight: bold;
      margin: 15px 0 25px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .earn {
      background: #6c5ce7;
      color: white;
    }

    .withdraw {
      background: #eeeaff;
      color: #6c5ce7;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>

  <!-- GigaPub OfferWall Loader -->
  <script src="https://wall.giga.pub/api/v1/loader.js?projectId=8279"></script>
</head>

<body>

  <div class="container">

    <h1>🎁 Mahmuda Rewards</h1>

    <div class="card">

      <div>💰 Your Balance</div>

      <div class="balance">
        0 Coins
      </div>

      <button class="earn" id="rewards-button">
        🎁 Earn Rewards
      </button>

      <button class="withdraw">
        💳 Withdraw
      </button>

      <div id="status">
        Loading OfferWall...
      </div>

    </div>

  </div>

  <script>

    // GigaPub OfferWall SDK
    const PROJECT_ID = "8279";

    (window.loadGigaSDKCallbacks || (window.loadGigaSDKCallbacks = [])).push(
      () => {

        window.loadOfferWallSDK({
          projectId: PROJECT_ID
        })

        .then(sdk => {

          // Save SDK
          window.gigaOfferWallSDK = sdk;

          document.getElementById("status").innerText =
            "OfferWall is ready!";

          // Reward claim event
          sdk.on("rewardClaim", async (data) => {

            console.log("Reward claim received:", data);

            /*
              Later we will connect this
              with the user's reward balance.
            */

            sdk.confirmReward(data.rewardId, data.hash);

          });

        })

        .catch(error => {

          console.error("GigaPub Error:", error);

          document.getElementById("status").innerText =
            "Unable to load OfferWall.";

        });

      }
    );


    // Open OfferWall
    document.getElementById("rewards-button").addEventListener(
      "click",
      function () {

        if (window.gigaOfferWallSDK) {

          window.gigaOfferWallSDK.open();

        } else {

          document.getElementById("status").innerText =
            "OfferWall is still loading...";

        }

      }
    );

  </script>

</body>
</html>
